
name: CI Level 3

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  quality-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Biome lint and format check
      - name: Biome check
        run: npm run lint

      # 5. TypeScript type check
      - name: Type check
        run: npm run type-check

      # 6. Build project
      - name: Build
        run: npm run build

      # 7. Run tests
      - name: Run tests
        run: npm test

      # 8. Security audit
      - name: Security audit
        run: npm audit --audit-level=high

