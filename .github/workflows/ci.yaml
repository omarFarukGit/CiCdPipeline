
name: CI Level 2

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  quality-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Lint
      - name: Run Lint
        run: npm run lint

      # 5. Build
      - name: Build project
        run: npm run build

      # 6. Run tests
      - name: Run Tests
        run: npm test

