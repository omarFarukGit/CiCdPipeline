name: CI Level 1
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - mian

jobs:
    quality-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/checkout@v4
              with:
                  node-version: 22
                  cache: npm
            
            - name: Install Dependencies
              run: npm ci
            
            # - name: Generate Prisma Client
            #   run: npx prisma generate

            - name: Build Application
              run: npm run build